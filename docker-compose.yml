# Single-node Kosha. Put the keys in a .env file next to this one:
#   KOSHA_ACCESS_KEY=admin
#   KOSHA_SECRET_KEY=<openssl rand -hex 20>
# then: docker compose up -d --build
services:
  kosha:
    build: .
    image: kosha:latest
    container_name: kosha
    restart: unless-stopped
    ports:
      - "${KOSHA_PORT:-9000}:9000"
    environment:
      KOSHA_ACCESS_KEY: ${KOSHA_ACCESS_KEY:?set KOSHA_ACCESS_KEY in .env}
      KOSHA_SECRET_KEY: ${KOSHA_SECRET_KEY:?set KOSHA_SECRET_KEY in .env}
    volumes:
      - kosha-data:/data
    # Docker's default seccomp profile blocks io_uring. This is that profile
    # (moby/profiles) with io_uring_setup, io_uring_enter and
    # io_uring_register allowed, so Kosha can use its io_uring backend while
    # every other syscall rule stays in place. Remove these two lines to fall
    # back to Docker's default profile and the thread-pool backend.
    security_opt:
      - seccomp=./docker/seccomp-io_uring.json
volumes:
  kosha-data:
