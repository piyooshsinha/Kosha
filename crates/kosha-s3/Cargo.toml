[package]
name = "kosha-s3"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
crc32fast = "1.5.2"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
kosha-engine = { version = "0.1.0", path = "../kosha-engine" }
md-5 = "0.11.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
aws-config = "1.12.0"
aws-sdk-s3 = "1.152.0"
axum = "0.8"
bytes = "1.12.1"
futures = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
