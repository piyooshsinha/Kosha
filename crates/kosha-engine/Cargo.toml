[package]
name = "kosha-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
fastcdc = "3"
futures = "0.3.34"
hex = "0.4.3"
io-uring = "0.7.15"
libc = "0.2.190"
md-5 = "0.11.0"
parking_lot = "0.12.5"
redb = "4.3.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
zstd = "0.14.2"

[dev-dependencies]
chrono = "0.4.45"
tempfile = "3.27.0"
