[package]
name = "kosha-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
blake3 = "1.8.7"
bytes = "1.12.1"
futures = "0.3.34"
hex = "0.4.3"
kosha-engine = { version = "0.1.0", path = "../kosha-engine" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
parking_lot = "0.12.5"
redb = "4.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = "0.14"
chrono = "0.4.45"
futures = "0.3.34"
tempfile = "3.27.0"
